# Gradle 构建参数
# 内存给足一些：KSP + Room 代码生成在高版本 JDK 上比较吃内存。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# 并行与构建缓存：单模块项目提升有限，但为将来拆模块留好设置。
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX（Android 官方支持库的替代品，Room 等依赖它）
android.useAndroidX=true

# 每个模块只生成自己使用到的 R 类字段，加快构建
android.nonTransitiveRClass=true

# Kotlin 官方代码风格
kotlin.code.style=official

# ---------------------------------------------------------------------------
# 关于项目路径：**必须是纯英文路径**
#
# 这个项目曾经被放到 D:\Projects\我的项目\Android\TimeLedger 下，结果：
#   1. AGP 直接拒绝构建（拒绝路径含非 ASCII 字符，b.android.com/95744）；
#   2. 加上 android.overridePathCheck=true 绕过检查后，编译能过，
#      但**单元测试全部 ClassNotFoundException** —— 测试 JVM 解析不了带中文的 classpath，
#      而且改成 -Dsun.jnu.encoding=UTF-8 也修不好。
#
# 所以这里不写那个开关：它关掉的是一道真的安全网。
# 现在的真实位置是 D:\Projects\Android\TimeLedger；
# 用户在 D:\Projects\我的项目\Android\TimeLedger 看到的是一个目录联接（junction），指向这里。
# 用 Android Studio 打开时请打开**真实路径**，否则会再次撞上上面第 1、2 条。
# ---------------------------------------------------------------------------

# 注意：这里**故意不写 org.gradle.java.home**。
# 那是机器相关的绝对路径，写进版本库会让别人 clone 后无法构建。
# 本机需要用 JDK 21 运行 Gradle（系统默认是 JDK 26，AGP 不支持），
# 构建时通过命令行传入，例如：
#   gradle -Dorg.gradle.java.home="<JDK21路径>" :app:assembleDebug
